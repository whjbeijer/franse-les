<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frans Leren - Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: pan-y;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-[100dvh] select-none">

    <!-- Compacte Header -->
    <header class="bg-indigo-600 text-white shadow-sm shrink-0 z-20">
        <div class="max-w-lg mx-auto px-4 py-3 flex justify-between items-center">
            <button onclick="openLijstModal()" class="flex items-center gap-2 bg-indigo-700/80 hover:bg-indigo-700 active:scale-95 transition px-3 py-1.5 rounded-xl text-sm font-semibold">
                <span>📚</span>
                <span>Lijsten</span>
                <span id="active-lists-count" class="bg-white text-indigo-700 text-xs font-bold px-1.5 py-0.5 rounded-md">1</span>
            </button>

            <div class="text-sm font-semibold tracking-wide">
                <span id="fc-current">0</span> / <span id="fc-total">0</span>
            </div>

            <div class="flex items-center gap-1.5">
                <button onclick="husselWoorden()" title="Hussel kaarten" class="bg-indigo-700/80 hover:bg-indigo-700 active:scale-95 transition p-2 rounded-xl text-sm">
                    🔀
                </button>
                <button onclick="speekFrans()" title="Luister uitspraak" class="bg-indigo-700/80 hover:bg-indigo-700 active:scale-95 transition p-2 rounded-xl text-sm">
                    🔊
                </button>
            </div>
        </div>
    </header>

    <!-- Fullscreen Flashcard Werkgebied -->
    <main class="flex-1 flex flex-col max-w-lg w-full mx-auto p-4 overflow-hidden">
        
        <!-- Swipeable & Tappable Card Wrapper -->
        <div id="swipe-area" class="flex-1 w-full perspective-1000 relative flex items-center justify-center">
            <div id="flashcard" class="w-full h-full card-transition transform-style-3d shadow-xl rounded-3xl bg-white border border-slate-200/80 relative cursor-pointer">
                
                <!-- Voorkant (Frans) -->
                <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col justify-between items-center p-8 text-center bg-gradient-to-br from-white via-white to-indigo-50/50 rounded-3xl">
                    <span id="fc-source-tag" class="text-xs font-medium text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Laden...</span>
                    
                    <div class="my-auto flex flex-col items-center">
                        <span class="text-xs font-bold uppercase tracking-widest text-indigo-500 mb-3">Frans</span>
                        <h2 id="fc-front-text" class="text-4xl sm:text-5xl font-bold text-slate-900 leading-tight break-words max-w-full">...</h2>
                    </div>

                    <div class="flex flex-col items-center gap-1 text-slate-400 text-xs">
                        <span>Tik om te draaien</span>
                        <span class="text-[11px] text-slate-300">← Swipe voor vorige / volgende →</span>
                    </div>
                </div>

                <!-- Achterkant (Nederlands) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col justify-between items-center p-8 text-center bg-gradient-to-br from-indigo-600 to-indigo-700 text-white rounded-3xl">
                    <span class="text-xs font-medium text-indigo-200 bg-indigo-800/40 px-3 py-1 rounded-full">Vertaling</span>
                    
                    <div class="my-auto flex flex-col items-center">
                        <span class="text-xs font-bold uppercase tracking-widest text-indigo-200 mb-3">Nederlands</span>
                        <h2 id="fc-back-text" class="text-4xl sm:text-5xl font-bold leading-tight break-words max-w-full">...</h2>
                    </div>

                    <div class="text-indigo-200/80 text-xs">
                        Tik om terug te draaien
                    </div>
                </div>

            </div>
        </div>

        <!-- Subtiele navigatiebalk onderaan (ook handig op desktop of als alternatief) -->
        <div class="pt-3 pb-1 flex justify-between items-center text-slate-500 text-sm shrink-0 px-2">
            <button onclick="gaNaarVorige()" class="py-2 px-4 rounded-xl hover:bg-slate-200/70 active:scale-95 transition font-medium">
                ← Vorige
            </button>
            <button onclick="speekFrans()" class="py-2 px-4 rounded-xl bg-white shadow-sm border border-slate-200 text-indigo-600 font-semibold active:scale-95 transition flex items-center gap-1.5">
                <span>🔊</span> Uitspraak
            </button>
            <button onclick="gaNaarVolgende()" class="py-2 px-4 rounded-xl hover:bg-slate-200/70 active:scale-95 transition font-medium">
                Volgende →
            </button>
        </div>
    </main>

    <!-- MODAL / OVERLAY: Hoofdstukken & Woordenlijsten selecteren -->
    <div id="lijst-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[85dvh] overflow-hidden animate-slide-up">
            
            <!-- Modal Header -->
            <div class="p-5 border-b border-slate-100 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-bold text-lg text-slate-900">Kies woordenlijsten</h3>
                    <p class="text-xs text-slate-500">Selecteer één of meerdere GitHub-bestanden</p>
                </div>
                <button onclick="sluitLijstModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold w-9 h-9 rounded-full flex items-center justify-center">
                    ✕
                </button>
            </div>

            <!-- Modal Body (Scrollbaar) -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Beschikbare bestanden</span>
                    <div class="flex gap-3 text-xs">
                        <button onclick="selecteerAlles(true)" class="text-indigo-600 font-semibold hover:underline">Alles</button>
                        <button onclick="selecteerAlles(false)" class="text-slate-400 hover:underline">Geen</button>
                    </div>
                </div>

                <div id="file-selector-list" class="space-y-2">
                    <!-- Wordt dynamisch gevuld -->
                </div>

                <!-- Preview van geladen woorden -->
                <div class="pt-3 border-t border-slate-100">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        Geladen woorden (<span id="word-count-label">0</span>)
                    </h4>
                    <div id="word-list-container" class="divide-y divide-slate-100 text-sm max-h-48 overflow-y-auto bg-slate-50 rounded-xl px-3">
                        <!-- Wordt dynamisch gevuld -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 shrink-0">
                <button onclick="sluitLijstModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-md active:scale-98 transition">
                    Start met oefenen (<span id="modal-btn-count">0</span> kaarten)
                </button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURATIE: Zet hier de namen van jouw .txt bestanden in GitHub!
        // =========================================================================
        const BESCHIKBARE_BESTANDEN = [
            { naam: "Hoofdstuk 1 - Begroetingen", bestand: "hoofdstuk1.txt" },
            { naam: "Hoofdstuk 2 - Eten & Drinken", bestand: "hoofdstuk2.txt" },
            { naam: "Hoofdstuk 3 - Werkwoorden", bestand: "hoofdstuk3.txt" }
        ];

        let actieveWoorden = [];
        let huidigeIndex = 0;
        let isGedraaid = false;

        // Modal openen/sluiten
        function openLijstModal() {
            document.getElementById('lijst-modal').classList.remove('hidden');
        }

        function sluitLijstModal() {
            document.getElementById('lijst-modal').classList.add('hidden');
        }

        // Initialiseer de bestandsselector
        function initBestandsSelector() {
            const container = document.getElementById('file-selector-list');
            container.innerHTML = '';
            BESCHIKBARE_BESTANDEN.forEach((item, index) => {
                container.innerHTML += `
                    <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-200 cursor-pointer hover:bg-indigo-50/40 transition">
                        <input type="checkbox" value="${item.bestand}" data-naam="${item.naam}" ${index === 0 ? 'checked' : ''} onchange="laadGeselecteerdeBestanden()" class="w-5 h-5 text-indigo-600 rounded-md focus:ring-indigo-500">
                        <div class="flex-1">
                            <span class="text-sm font-semibold text-slate-800 block">${item.naam}</span>
                            <span class="text-[11px] text-slate-400 font-mono">${item.bestand}</span>
                        </div>
                    </label>
                `;
            });
            laadGeselecteerdeBestanden();
        }

        function selecteerAlles(status) {
            document.querySelectorAll('#file-selector-list input[type="checkbox"]').forEach(cb => cb.checked = status);
            laadGeselecteerdeBestanden();
        }

        // Haal aangevinkte bestanden live op uit GitHub
        async function laadGeselecteerdeBestanden() {
            const checkboxes = document.querySelectorAll('#file-selector-list input[type="checkbox"]:checked');
            document.getElementById('active-lists-count').textContent = checkboxes.length;
            actieveWoorden = [];

            for (const cb of checkboxes) {
                const bestandsnaam = cb.value;
                const lijstNaam = cb.getAttribute('data-naam');
                try {
                    const response = await fetch(`${bestandsnaam}?t=${new Date().getTime()}`);
                    if (!response.ok) throw new Error(`Kan ${bestandsnaam} niet vinden`);
                    const tekst = await response.text();
                    
                    tekst.split('\n').forEach(regel => {
                        if (regel.includes('-')) {
                            const delen = regel.split('-');
                            const fr = delen[0].trim();
                            const nl = delen.slice(1).join('-').trim();
                            if (fr && nl) {
                                actieveWoorden.push({ fr, nl, bron: lijstNaam });
                            }
                        }
                    });
                } catch (err) {
                    console.warn(err.message);
                }
            }

            huidigeIndex = 0;
            updateUI();
        }

        function updateUI() {
            document.getElementById('fc-total').textContent = actieveWoorden.length;
            document.getElementById('word-count-label').textContent = actieveWoorden.length;
            document.getElementById('modal-btn-count').textContent = actieveWoorden.length;

            const container = document.getElementById('word-list-container');
            container.innerHTML = '';
            if (actieveWoorden.length === 0) {
                container.innerHTML = `<p class="text-slate-400 py-4 text-center text-xs">Geen woorden geladen. Vink een lijst aan.</p>`;
            } else {
                actieveWoorden.forEach(w => {
                    container.innerHTML += `
                        <div class="py-2 flex justify-between items-center gap-2">
                            <div class="truncate">
                                <strong class="text-slate-900">${w.fr}</strong> 
                                <span class="text-slate-400 mx-1">-</span> 
                                <span class="text-slate-600">${w.nl}</span>
                            </div>
                        </div>
                    `;
                });
            }
            toonKaart();
        }

        function husselWoorden() {
            if (actieveWoorden.length < 2) return;
            actieveWoorden.sort(() => Math.random() - 0.5);
            huidigeIndex = 0;
            toonKaart();
        }

        function toonKaart() {
            const card = document.getElementById('flashcard');
            isGedraaid = false;
            card.style.transform = '';
            card.classList.remove('rotate-y-180');

            if (actieveWoorden.length === 0) {
                document.getElementById('fc-current').textContent = "0";
                document.getElementById('fc-source-tag').textContent = "Geen lijst";
                document.getElementById('fc-front-text').textContent = "Kies een lijst";
                document.getElementById('fc-back-text').textContent = "Tik linksboven op 'Lijsten'";
                return;
            }

            if (huidigeIndex >= actieveWoorden.length) huidigeIndex = 0;
            if (huidigeIndex < 0) huidigeIndex = actieveWoorden.length - 1;

            document.getElementById('fc-current').textContent = huidigeIndex + 1;
            document.getElementById('fc-source-tag').textContent = actieveWoorden[huidigeIndex].bron;
            document.getElementById('fc-front-text').textContent = actieveWoorden[huidigeIndex].fr;
            document.getElementById('fc-back-text').textContent = actieveWoorden[huidigeIndex].nl;
        }

        function draaiKaart() {
            if (actieveWoorden.length === 0) {
                openLijstModal();
                return;
            }
            isGedraaid = !isGedraaid;
            const card = document.getElementById('flashcard');
            card.style.transform = isGedraaid ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function gaNaarVolgende() {
            if (actieveWoorden.length === 0) return;
            const card = document.getElementById('flashcard');
            card.style.opacity = '0';
            card.style.transform = 'translateX(-40px)';
            setTimeout(() => {
                huidigeIndex = (huidigeIndex + 1) % actieveWoorden.length;
                card.style.transition = 'none';
                card.style.transform = 'translateX(40px)';
                toonKaart();
                void card.offsetWidth; // force reflow
                card.style.transition = '';
                card.style.opacity = '1';
                card.style.transform = '';
            }, 150);
        }

        function gaNaarVorige() {
            if (actieveWoorden.length === 0) return;
            const card = document.getElementById('flashcard');
            card.style.opacity = '0';
            card.style.transform = 'translateX(40px)';
            setTimeout(() => {
                huidigeIndex = (huidigeIndex - 1 + actieveWoorden.length) % actieveWoorden.length;
                card.style.transition = 'none';
                card.style.transform = 'translateX(-40px)';
                toonKaart();
                void card.offsetWidth; // force reflow
                card.style.transition = '';
                card.style.opacity = '1';
                card.style.transform = '';
            }, 150);
        }

        function speekFrans() {
            if (actieveWoorden.length === 0) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(actieveWoorden[huidigeIndex].fr);
                utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
            }
        }

        // =========================================================================
        // TOUCH / SWIPE & TAP DETECTIE
        // =========================================================================
        const swipeArea = document.getElementById('swipe-area');
        const flashcardEl = document.getElementById('flashcard');
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let isDragging = false;

        swipeArea.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchCurrentX = touchStartX;
            isDragging = true;
            flashcardEl.style.transition = 'none';
        }, { passive: true });

        swipeArea.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            touchCurrentX = e.touches[0].clientX;
            const deltaX = touchCurrentX - touchStartX;
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY);

            // Alleen horizontaal meebewegen als de beweging vooral horizontaal is
            if (Math.abs(deltaX) > 10 && Math.abs(deltaX) > deltaY) {
                const rotateFlip = isGedraaid ? 'rotateY(180deg)' : 'rotateY(0deg)';
                const tilt = deltaX * 0.04;
                flashcardEl.style.transform = `translateX(${deltaX}px) rotateZ(${tilt}deg) ${rotateFlip}`;
            }
        }, { passive: true });

        swipeArea.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            flashcardEl.style.transition = '';

            const deltaX = touchCurrentX - touchStartX;
            const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
            const swipeThreshold = 55; // pixels voor een geldige swipe

            if (Math.abs(deltaX) > swipeThreshold && Math.abs(deltaX) > deltaY) {
                if (deltaX < 0) {
                    gaNaarVolgende(); // Swipe naar links -> volgende kaart
                } else {
                    gaNaarVorige();   // Swipe naar rechts -> vorige kaart
                }
            } else if (Math.abs(deltaX) < 12 && deltaY < 12) {
                // Korte tik zonder te slepen -> kaart omdraaien
                draaiKaart();
            } else {
                // Terugveren naar midden als swipe te kort was
                flashcardEl.style.transform = isGedraaid ? 'rotateY(180deg)' : 'rotateY(0deg)';
            }
        });

        // Klik-ondersteuning voor muis/desktop (zonder dubbele trigger op touch)
        let lastTouchTime = 0;
        swipeArea.addEventListener('touchend', () => { lastTouchTime = Date.now(); }, { passive: true });
        flashcardEl.addEventListener('click', () => {
            if (Date.now() - lastTouchTime < 500) return;
            draaiKaart();
        });

        // Toetsenbord pijltjes & spatiebalk voor desktop
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lijst-modal').classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') gaNaarVolgende();
            if (e.key === 'ArrowLeft') gaNaarVorige();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                draaiKaart();
            }
        });

        initBestandsSelector();
    </script>
</body>
</html>
